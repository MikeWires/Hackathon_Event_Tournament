<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SharkByte Pathway</title>
    <!-- Simple styling for the pathway layout -->
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; background:#f5f5f5; }
        .container { max-width: 960px; margin: auto; background:#fff; padding:2rem; }
        header { text-align:center; margin-bottom:2rem; }
        .step { border-left:4px solid #2c3e50; padding-left:1rem; margin-bottom:1.5rem; }
        .step h3 { margin-top:0; }
        footer { text-align:center; margin-top:2rem; font-size:0.9rem; color:#777; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SharkByte Pathway</h1>
            <p id="description">A brief description of the pathway goes here.</p>
        </header>
        <section id="steps">
            <!-- Dynamically injected steps will appear here -->
        </section>
        <footer>
            <p>Powered by Swarms API</p>
        </footer>
    </div>
    <script>
        // === Swarms API integration ===
        // Replace the placeholder with your actual API key if you plan to keep it client‑side (not recommended for production).
        const SWARMS_API_KEY = "sk-be63031381600a5ae5fe1c68ee41fc9928f0898903a1e4e28e76dfb393f43294";
        const SWARMS_ENDPOINT = "https://api.swarms.ai/v1/pathway/steps"; // Example endpoint – adjust as needed

        // Example function to fetch pathway steps and render them
        async function loadPathwaySteps() {
            try {
                const response = await fetch(SWARMS_ENDPOINT, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${SWARMS_API_KEY}`,
                        "Content-Type": "application/json"
                    }
                });
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }
                const data = await response.json();
                renderSteps(data.steps || []);
            } catch (err) {
                console.error("Failed to load pathway steps:", err);
                const stepsDiv = document.getElementById("steps");
                stepsDiv.innerHTML = `<p style="color:red;">Unable to load steps – see console for details.</p>`;
            }
        }

        function renderSteps(steps) {
            const container = document.getElementById("steps");
            if (steps.length === 0) {
                container.innerHTML = "<p>No steps available.</p>";
                return;
            }
            const html = steps.map((step, idx) => `
                <div class="step" id="step-${idx}">
                    <h3>Step ${idx + 1}: ${step.title}</h3>
                    <p>${step.description}</p>
                </div>
            `).join("\n");
            container.innerHTML = html;
        }

        // Load steps on page load
        document.addEventListener("DOMContentLoaded", loadPathwaySteps);
    </script>
</body>
</html>
